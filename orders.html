<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Каталог — CrowdHub</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

<link href="favicon.ico" rel="icon" type="image/x-icon"/><link href="favicon-32.png" rel="icon" sizes="32x32" type="image/png"/><link href="favicon-64.png" rel="icon" sizes="64x64" type="image/png"/><link href="apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180"/><link href="style.css" rel="stylesheet"/>
</head>
<body data-page="orders">
<div class="liquid-orb orb-one"></div><div class="liquid-orb orb-two"></div>
<div id="siteHeader"></div>
<main class="page-main">
<div class="container">
<div class="catalog-heading">
<div><span class="section-caption">КАТАЛОГ</span><h1>Все задания</h1><p>Расширенный каталог: фильтруй, сортируй и выбирай удобный вид карточек.</p></div>
<a class="btn btn-primary" href="create-order.html">+ Разместить задачу</a>
</div>
<div class="glass catalog-controls">
<div class="catalog-search"><svg viewbox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"></path></svg><input id="ordersSearch" placeholder="Поиск по задачам..." type="text"/></div>
<select id="ordersCategory"><option value="all">Все категории</option><option value="Разработка">Разработка</option><option value="Дизайн">Дизайн</option><option value="Маркетинг">Маркетинг</option><option value="Аналитика">Аналитика</option><option value="Контент">Контент</option></select>
<select id="ordersCompany"><option value="all">Все компании</option></select>
<select id="ordersStatus"><option value="all">Все статусы</option><option value="open">Открытые</option><option value="in_review">Есть решения</option><option value="paid">Завершённые</option></select>
<select id="ordersSort"><option value="newest">Сначала новые</option><option value="price_desc">Цена: выше</option><option value="price_asc">Цена: ниже</option><option value="popular">Популярные</option></select>
</div>
<div class="glass discovery-bar">
<div><span class="section-caption">БЫСТРЫЙ ПОИСК</span><strong>Популярные навыки</strong></div>
<div class="quick-skills" id="quickSkills">
<button data-skill="Figma">Figma</button><button data-skill="Python">Python</button><button data-skill="UI">UI</button><button data-skill="Telegram">Telegram</button><button data-skill="Marketing">Marketing</button><button data-skill="Content">Content</button>
</div>
<button class="btn btn-glass" id="clearQuickSkill">Сбросить</button>
</div>
<div class="catalog-toolbar-row"><div class="catalog-meta">Найдено: <strong id="ordersCount">0</strong><span id="activeSkillLabel"></span></div><div class="catalog-view-toggle" aria-label="Вид каталога"><button class="active" type="button" data-catalog-view="grid" title="Карточки"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button><button type="button" data-catalog-view="list" title="Список"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></button></div></div>
<div class="orders-grid" id="ordersGrid"></div>
<div class="glass empty-state" id="ordersEmpty"><strong>Ничего не найдено</strong><span>Попробуй изменить фильтры.</span></div>
</div>
</main>
<div class="toast-container" id="toastContainer"></div>
<script defer src="js/storage.js"></script>
  <script defer src="js/i18n.js"></script>
  <script defer src="js/navigation.js"></script>
  <script defer src="js/notifications.js"></script>
  <script defer src="js/components.js"></script>
  <script defer src="js/chat.js"></script>
  <script defer src="js/tasks.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/profile.js"></script>
  <script defer src="js/company.js"></script>
  <script defer src="js/favorites.js"></script>
  <script defer src="js/forms.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
