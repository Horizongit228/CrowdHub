<!DOCTYPE html>

<html lang="ru">
<head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>Вход — CrowdHub</title><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="favicon.ico" rel="icon" type="image/x-icon"/><link href="favicon-32.png" rel="icon" sizes="32x32" type="image/png"/><link href="favicon-64.png" rel="icon" sizes="64x64" type="image/png"/><link href="apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180"/><link href="style.css" rel="stylesheet"/></head>
<body data-page="login">
<div class="liquid-orb auth-orb-one"></div><div class="liquid-orb auth-orb-two"></div>
<main class="auth-page">
<a class="auth-logo" href="index.html"><span class="brand-icon brand-logo-image"><img alt="" src="logo.png"/></span><strong>CrowdHub</strong></a>
<section class="glass auth-card">
<span class="section-caption">С ВОЗВРАЩЕНИЕМ</span><h1>Вход</h1><p>Вернись к своим задачам и результатам.</p>
<form id="loginForm"><label class="form-field"><span>Email</span><input id="loginEmail" placeholder="name@example.com" required="" type="email"/></label><label class="form-field"><span>Пароль</span><input id="loginPassword" placeholder="••••••••" required="" type="password"/></label><label class="check-row"><input checked="" id="rememberLogin" type="checkbox"/><span>Запомнить вход на этом устройстве</span></label><button class="btn btn-primary btn-full">Войти</button></form>
<div class="demo-accounts enhanced-demo"><strong>БЫСТРЫЙ ДЕМО-ВХОД</strong><button class="demo-login-button" data-demo="employer" type="button">💼 Войти работодателем</button><button class="demo-login-button" data-demo="student" type="button">🎓 Войти исполнителем</button></div>

<p class="auth-switch">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
</section>
</main>
<div class="toast-container" id="toastContainer"></div><script defer src="js/storage.js"></script>
  <script defer src="js/i18n.js"></script>
  <script defer src="js/navigation.js"></script>
  <script defer src="js/notifications.js"></script>
  <script defer src="js/components.js"></script>
  <script defer src="js/chat.js"></script>
  <script defer src="js/tasks.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/profile.js"></script>
  <script defer src="js/company.js"></script>
  <script defer src="js/favorites.js"></script>
  <script defer src="js/forms.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
